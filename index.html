<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - Práctica 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspectiva { perspective: 1000px; }
        .estilo-3d { transform-style: preserve-3d; }
        .ocultar-reverso { backface-visibility: hidden; }
        .rotacion-xy { transform: rotateX(180deg) rotateY(180deg); }
    </style>
</head>
<body class="bg-[#f0f0f0] min-h-screen p-8 flex flex-col items-center font-sans">

    <div class="flex gap-8 mb-16 mt-8">
        <a href="page01.html" class="group w-48 h-48 perspectiva block cursor-pointer">
            <div class="relative w-full h-full transition-transform duration-700 estilo-3d group-hover:rotacion-xy">
                <div class="absolute inset-0 bg-[#8cbced] text-white flex items-center justify-center rounded-xl text-3xl font-medium ocultar-reverso shadow-md">
                    page1
                </div>
                <div class="absolute inset-0 bg-[#42a5f5] text-white flex items-center justify-center rounded-xl text-xl font-medium ocultar-reverso rotacion-xy shadow-md">
                    Ir a Inbox
                </div>
            </div>
        </a>

        <a href="page02.html" class="group w-48 h-48 perspectiva block cursor-pointer">
            <div class="relative w-full h-full transition-transform duration-700 estilo-3d group-hover:rotacion-xy">
                <div class="absolute inset-0 bg-[#8cbced] text-white flex items-center justify-center rounded-xl text-3xl font-medium ocultar-reverso shadow-md">
                    page2
                </div>
                <div class="absolute inset-0 bg-[#42a5f5] text-white flex items-center justify-center rounded-xl text-xl font-medium ocultar-reverso rotacion-xy shadow-md">
                    Ir a Tarjetas
                </div>
            </div>
        </a>

        <a href="page03.html" class="group w-48 h-48 perspectiva block cursor-pointer">
            <div class="relative w-full h-full transition-transform duration-700 estilo-3d group-hover:rotacion-xy">
                <div class="absolute inset-0 bg-[#8cbced] text-white flex items-center justify-center rounded-xl text-3xl font-medium ocultar-reverso shadow-md">
                    page3
                </div>
                <div class="absolute inset-0 bg-[#42a5f5] text-white flex items-center justify-center rounded-xl text-xl font-medium ocultar-reverso rotacion-xy shadow-md">
                    Ir a Tienda
                </div>
            </div>
        </a>
    </div>

    <div class="bg-[#1e1e1e] w-full max-w-4xl rounded-md shadow-2xl p-6 text-white">
        <div class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6 text-sm">
            <div class="flex items-center gap-3">
                <span class="bg-gray-300 text-black rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold">1</span>
                <span>Review Order</span>
            </div>
            <div class="flex items-center gap-3 text-gray-500">
                <span class="bg-gray-700 rounded-full w-6 h-6 flex items-center justify-center text-xs">2</span>
                <span>Select Shipping</span>
            </div>
            <div class="flex items-center gap-3 text-gray-500">
                <span class="bg-gray-700 rounded-full w-6 h-6 flex items-center justify-center text-xs">3</span>
                <span>Submit</span>
            </div>
        </div>

        <h2 class="text-2xl mb-6">Order</h2>

        <div class="w-full text-sm">
            <div class="grid grid-cols-4 border-b border-gray-800 pb-4 mb-4 font-bold">
                <div class="col-span-2">Description</div>
                <div class="text-right">Quantity</div>
                <div class="text-right">Price</div>
            </div>
            <div class="grid grid-cols-4 border-b border-gray-800 pb-4 mb-4 text-gray-300">
                <div class="col-span-2">Product 1</div>
                <div class="text-right">2</div>
                <div class="text-right">20</div>
            </div>
            <div class="grid grid-cols-4 border-b border-gray-800 pb-4 mb-6 text-gray-300">
                <div class="col-span-2">Product 2</div>
                <div class="text-right">10</div>
                <div class="text-right">150</div>
            </div>
            <div class="grid grid-cols-4 border-b border-gray-700 pb-4 mb-8 font-bold">
                <div class="col-span-2">Total</div>
                <div></div>
                <div class="text-right">$170</div>
            </div>
        </div>

        <div class="flex justify-between items-center">
            <button class="text-gray-600 font-bold hover:text-gray-400 transition-colors">PREVIOUS</button>
            <button class="bg-[#333333] hover:bg-[#444444] transition-colors text-white font-bold py-2 px-6 rounded">NEXT</button>
        </div>
    </div>

</body>
</html>
